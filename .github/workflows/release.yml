name: Release desktop build

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GH_REPO: ${{ github.repository }}
  TAG: ${{ github.ref_name }}

jobs:
  # One draft per tag, created before the builds: parallel electron-builder runs would otherwise
  # each create their own release and split the artifacts between them.
  draft:
    runs-on: ubuntu-latest
    steps:
      - run: gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --draft --title "$TAG" --notes ""

  build:
    needs: draft
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      # Uploads into the draft above (publish.releaseType is "draft").
      - run: npm run electron:release

  # Auto-update only sees published releases, so publish once every platform has uploaded.
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - run: gh release edit "$TAG" --draft=false --latest
